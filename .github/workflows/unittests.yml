name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flask flask-cors

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src --cov=backend --cov-report=term-missing

      - name: Generate coverage badge data
        run: pytest tests/ --cov=src --cov=backend --cov-report=xml